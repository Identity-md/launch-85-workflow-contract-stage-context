[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# The verifier runs offline with no cheat-code escape hatches.
ffi = false
fs_permissions = []
offline = true
auto_detect_solc = false

[lint]
# The Tontine's clocks are 30-day windows; second-level timestamp drift by validators is irrelevant.
exclude_lints = ["block-timestamp"]

[fuzz]
runs = 256
